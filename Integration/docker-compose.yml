version: '3.8'

services:
  backend:
    build:
      context: ./kumeet.ai-develop/backend
      dockerfile: Dockerfile
    container_name: kumeet-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:uzay11ilgin@db:5432/kumeet
      - SHARED_VOLUME_PATH=/app/shared_data
      - UPLOAD_DIR=/app/shared_data/uploads
      - DEBUG=true
      - FIREBASE_DEVELOPMENT_MODE=true
    volumes:
      - shared_data:/app/shared_data
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./kumeet.ai-develop/frontend
      dockerfile: Dockerfile
    container_name: kumeet-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:14
    container_name: kumeet-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=uzay11ilgin
      - POSTGRES_DB=kumeet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kumeet"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  shared_data:
    name: kumeet_shared_data
  postgres_data:
    name: kumeet_postgres_data
