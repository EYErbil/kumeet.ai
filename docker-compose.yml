# To built image:
# docker-compose build

# To start:
# docker-compose up

version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:PASSWORD@db:5432/postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=PASSWORD
      # Summarizer configuration
      - GEMINI_API_KEY=AIzaSyBcizqje0iym5bPHx-OoepPbGqGcuLADKM
      - USE_GPU=false
      - RESULTS_DIR=/app/results
      - DB_PATH=/app/data/summaries.db
      - WHISPER_MODEL=normal
      - HF_TOKEN=TOKEN_EKLE
    volumes:
      - ./backend:/app
      - ./summarizer:/app/summarizer
      - backend_logs:/app/logs
      - backend_storage:/app/data
      - backend_uploads:/app/uploads
      - backend_results:/app/results
    depends_on:
      - db
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PASSWORD
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  backend_logs:
  backend_storage:
  backend_uploads:
  backend_results: