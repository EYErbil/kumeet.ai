<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">KuMeet.ai</title>
  <desc id="desc">Turn meeting recordings into structured, actionable follow-up.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#24103f"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#171126"/>
  <rect width="1200" height="420" rx="28" fill="url(#background)" opacity="0.92"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1090" cy="28" r="210" fill="#7c3aed" opacity="0.13"/>
  <circle cx="30" cy="410" r="170" fill="#c084fc" opacity="0.08"/>

  <g transform="translate(72 66)">
    <g transform="translate(0 0)">
      <rect width="54" height="54" rx="15" fill="url(#accent)"/>
      <path d="M15 14v26M39 14 27 27l12 13" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="76" y="41" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700">KuMeet.ai</text>
    <text x="0" y="112" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="650">
      <tspan x="0" dy="0">Meetings become useful</tspan>
      <tspan x="0" dy="39">the moment they end.</tspan>
    </text>
    <text x="0" y="206" fill="#ddd6fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">
      <tspan x="0" dy="0">Speaker-aware transcripts, timestamped insights,</tspan>
      <tspan x="0" dy="29">decisions, action items, and participation analytics.</tspan>
    </text>

    <g transform="translate(0 276)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">
      <g><rect width="96" height="34" rx="17" fill="#7c3aed" fill-opacity="0.38" stroke="#c4b5fd" stroke-opacity="0.45"/><text x="48" y="22" fill="#ffffff" text-anchor="middle">Transcribe</text></g>
      <g transform="translate(108 0)"><rect width="88" height="34" rx="17" fill="#7c3aed" fill-opacity="0.38" stroke="#c4b5fd" stroke-opacity="0.45"/><text x="44" y="22" fill="#ffffff" text-anchor="middle">Diarize</text></g>
      <g transform="translate(208 0)"><rect width="102" height="34" rx="17" fill="#7c3aed" fill-opacity="0.38" stroke="#c4b5fd" stroke-opacity="0.45"/><text x="51" y="22" fill="#ffffff" text-anchor="middle">Summarize</text></g>
      <g transform="translate(322 0)"><rect width="62" height="34" rx="17" fill="#7c3aed" fill-opacity="0.38" stroke="#c4b5fd" stroke-opacity="0.45"/><text x="31" y="22" fill="#ffffff" text-anchor="middle">Act</text></g>
    </g>
  </g>

  <g transform="translate(672 52)" filter="url(#shadow)">
    <rect width="458" height="316" rx="22" fill="#ffffff"/>
    <rect width="458" height="58" rx="22" fill="#faf7ff"/>
    <rect y="36" width="458" height="22" fill="#faf7ff"/>
    <circle cx="28" cy="29" r="6" fill="#fca5a5"/>
    <circle cx="49" cy="29" r="6" fill="#fde68a"/>
    <circle cx="70" cy="29" r="6" fill="#86efac"/>
    <text x="102" y="35" fill="#6b7280" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Weekly Product Sync</text>

    <g transform="translate(28 84)">
      <text x="0" y="0" fill="#111827" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Speaker timeline</text>
      <g transform="translate(0 20)">
        <rect width="402" height="54" rx="10" fill="#f5f3ff"/>
        <path d="M10 28h7l5-16 7 31 7-23 7 10 8-18 7 31 8-15 8 6 7-25 8 36 8-21 7 9 8-19 7 29 8-13 8 6 7-26 8 34 8-18 8 9 7-22 8 30 7-14 8 7 8-25 7 32 8-17 8 8 7-20 8 27 8-12 7 5 8-17 8 20 7-8h9" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <g transform="translate(28 184)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="0" y="0" fill="#111827" font-size="15" font-weight="700">Meeting intelligence</text>
      <g transform="translate(0 18)">
        <circle cx="9" cy="9" r="9" fill="#8b5cf6"/>
        <path d="m5 9 3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="14" fill="#374151" font-size="13">Decision captured with its timestamp</text>
      </g>
      <g transform="translate(0 52)">
        <circle cx="9" cy="9" r="9" fill="#a855f7"/>
        <path d="m5 9 3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="14" fill="#374151" font-size="13">Action item assigned for follow-up</text>
      </g>
      <g transform="translate(0 86)">
        <circle cx="9" cy="9" r="9" fill="#c084fc"/>
        <path d="m5 9 3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="14" fill="#374151" font-size="13">Concise recap ready to share</text>
      </g>
    </g>
  </g>
</svg>
